name: Windows bug report
description: Report a reproducible problem with MeetingBar for Windows
title: 'Bug: '
labels: bug
body:
  - type: input
    id: windows-version
    attributes:
      label: Windows version
      description: Include the edition, version, and OS build from Settings > System > About.
      placeholder: Windows 11 24H2, build 26100
    validations:
      required: true
  - type: input
    id: meetingbar-version
    attributes:
      label: MeetingBar version or commit
      placeholder: Release version or commit SHA
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Calendar provider
      options:
        - Classic Outlook
        - ICS file or feed
        - Google Calendar
        - Not provider-specific
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      options:
        - Tray or popup
        - Near-tray taskbar widget
        - Taskbar-left widget
        - Windows Widgets Board (Win+W)
        - Settings
        - Notifications
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Explain the actual and expected behavior. Remove meeting titles, links, attendee details, and credentials.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Add relevant logs or screenshots only after removing personal calendar and authentication data.
