name: Windows feature request
description: Suggest an improvement to MeetingBar for Windows
title: 'Feature: '
labels: feature
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What Windows workflow or limitation should this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the desired behavior and affected Windows surface.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: provider
    attributes:
      label: Calendar provider
      options:
        - All providers
        - Classic Outlook
        - ICS file or feed
        - Google Calendar
        - Not provider-specific
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add sanitized mockups or examples if useful.
