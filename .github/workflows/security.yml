name: Windows Dependency Audit

on:
  pull_request:
    paths:
      - '**/*.csproj'
      - '.github/workflows/security.yml'
  push:
    branches:
      - main
    paths:
      - '**/*.csproj'
      - '.github/workflows/security.yml'
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  nuget-audit:
    name: Audit NuGet dependencies
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Restore Windows App SDK projects
        shell: pwsh
        run: |
          $audit = @(
            '-p:NuGetAudit=true'
            '-p:NuGetAuditMode=all'
            '-p:NuGetAuditLevel=low'
            '-p:TreatWarningsAsErrors=true'
          )
          dotnet restore .\SettingsApp\MeetingBar.Settings.csproj -r win-x64 -p:Platform=x64 @audit
          dotnet restore .\WidgetProvider\MeetingBar.WidgetProvider.csproj -r win-x64 -p:Platform=x64 @audit

      - name: Check for vulnerable packages
        shell: pwsh
        run: |
          dotnet list .\SettingsApp\MeetingBar.Settings.csproj package --vulnerable --include-transitive
          dotnet list .\WidgetProvider\MeetingBar.WidgetProvider.csproj package --vulnerable --include-transitive
