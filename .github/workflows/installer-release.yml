name: Publish optimized Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Properties/AssemblyInfo.cs'
      - 'Installer/MeetingBar.iss'
      - 'Installer/RELEASE_NOTES.md'

permissions:
  contents: write

concurrency:
  group: optimized-installer-release
  cancel-in-progress: true

jobs:
  installer:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 8.0.x
      - name: Read and validate release version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assembly = Get-Content Properties/AssemblyInfo.cs -Raw
          if ($assembly -notmatch 'AssemblyFileVersion\("([0-9.]+)"\)') { throw 'Application version missing' }
          $version = $Matches[1]
          $installer = Get-Content Installer/MeetingBar.iss -Raw
          if ($installer -notmatch '#define AppVersion "([0-9.]+)"' -or $Matches[1] -ne $version) { throw 'Installer version does not match application' }
          "MEETINGBAR_VERSION=$version" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          gh release view "v$version" --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit "v$version" --title "MeetingBar Windows v$version - Outlook clásico y español" --notes-file Installer/RELEASE_NOTES.md --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw 'Release notes update failed' }
            'MEETINGBAR_RELEASE_EXISTS=true' | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          }
          exit 0
      - name: Build and test application
        if: env.MEETINGBAR_RELEASE_EXISTS != 'true'
        shell: pwsh
        run: |
          ./build.ps1 -Configuration Release -Test -Package
          if ($LASTEXITCODE -ne 0) { throw 'Application build or tests failed' }
          dotnet build Installer/ConfigTool/ConfigTool.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Installer configuration tool build failed' }
          ./Tests/bin/Release/net472/MeetingBar.Tests.exe --render-widget "$env:RUNNER_TEMP/widget-preview.png"
          if ($LASTEXITCODE -ne 0) { throw 'Widget layout check failed' }
          ./Tests/bin/Release/net472/MeetingBar.Tests.exe --render-fallback "$env:RUNNER_TEMP/widget-fallback.png"
          if ($LASTEXITCODE -ne 0) { throw 'Fallback layout check failed' }
          ./Tests/bin/Release/net472/MeetingBar.Tests.exe --render-agenda "$env:RUNNER_TEMP/compact-agenda.png"
          if ($LASTEXITCODE -ne 0) { throw 'Agenda grouping check failed' }
      - name: Compile installer with preinstalled Inno Setup
        if: env.MEETINGBAR_RELEASE_EXISTS != 'true'
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (!(Test-Path $compiler)) { throw 'Preinstalled Inno Setup compiler not found' }
          & $compiler Installer/MeetingBar.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
      - name: Verify install, configuration preservation and uninstall
        if: env.MEETINGBAR_RELEASE_EXISTS != 'true'
        shell: pwsh
        run: |
          $configDir = Join-Path $env:APPDATA 'MeetingBar'
          New-Item -ItemType Directory -Force $configDir | Out-Null
          @{AutoJoin=$true;StartWithWindows=$false;InstallerTestMarker='preserved';Provider=0} | ConvertTo-Json | Set-Content (Join-Path $configDir 'settings.json')
          $testDir = Join-Path $env:RUNNER_TEMP 'MeetingBarInstallerTest'
          $installer = Join-Path $PWD "dist/MeetingBar-Windows-v$env:MEETINGBAR_VERSION-Setup.exe"
          $result = Start-Process $installer -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/NOICONS',('/DIR="'+$testDir+'"')) -WindowStyle Hidden -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "Install failed: $($result.ExitCode)" }
          if (!(Test-Path (Join-Path $testDir 'Settings/MeetingBar.Settings.exe'))) { throw 'Settings dependencies missing' }
          $version = (Get-Item (Join-Path $testDir 'MeetingBar.exe')).VersionInfo.FileVersion
          if ($version -ne $env:MEETINGBAR_VERSION) { throw "Unexpected binary version: $version" }
          $settings = Get-Content (Join-Path $configDir 'settings.json') -Raw | ConvertFrom-Json
          if ($settings.AutoJoin -ne $true -or $settings.InstallerTestMarker -ne 'preserved' -or $settings.StartWithWindows -ne $false) { throw 'Settings preservation failed' }
          if (!(Test-Path (Join-Path $configDir 'settings.json.before-install.bak'))) { throw 'Configuration backup missing' }
          # Exercise the same silent handoff/relaunch flag used by the in-app updater.
          $result = Start-Process $installer -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/OTA=1',('/DIR="'+$testDir+'"')) -WindowStyle Hidden -PassThru
          if (!$result.WaitForExit(180000)) { throw 'OTA installer did not finish' }
          if ($result.ExitCode -ne 0) { throw 'OTA installer handoff failed' }
          $relaunched = $null
          for ($attempt = 0; $attempt -lt 20; $attempt++) {
            $relaunched = Get-Process MeetingBar -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq (Join-Path $testDir 'MeetingBar.exe') }
            if ($relaunched) { break }
            Start-Sleep -Milliseconds 500
          }
          if (!$relaunched) { throw 'OTA did not relaunch MeetingBar' }
          Start-Process (Join-Path $testDir 'MeetingBar.exe') -ArgumentList '--quit' -WindowStyle Hidden -Wait
          foreach ($process in $relaunched) {
            if (!$process.WaitForExit(10000)) { throw 'MeetingBar did not close after the OTA smoke test' }
          }
          $result = Start-Process (Join-Path $testDir 'unins000.exe') -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -WindowStyle Hidden -Wait -PassThru
          if ($result.ExitCode -ne 0 -or (Test-Path (Join-Path $testDir 'MeetingBar.exe'))) { throw 'Uninstall failed' }
      - name: Publish release and assets
        if: env.MEETINGBAR_RELEASE_EXISTS != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v' + $env:MEETINGBAR_VERSION
          Copy-Item dist/MeetingBar-Windows-portable.zip "dist/MeetingBar-Windows-$tag-portable.zip"
          $assets = @("dist/MeetingBar-Windows-$tag-Setup.exe", "dist/MeetingBar-Windows-$tag-portable.zip")
          $setup = Get-Item $assets[0]
          $manifest = @{
            schema_version = 1
            tag_name = $tag
            body = Get-Content Installer/RELEASE_NOTES.md -Raw
            browser_download_url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/$($setup.Name)"
            digest = 'sha256:' + (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            size = $setup.Length
          }
          $manifest | ConvertTo-Json -Depth 3 | Set-Content dist/update.json -Encoding utf8NoBOM
          $assets += 'dist/update.json'
          $checksums = foreach ($asset in $assets) {
            "$((Get-FileHash $asset -Algorithm SHA256).Hash.ToLowerInvariant())  $([IO.Path]::GetFileName($asset))"
          }
          $checksums | Set-Content dist/SHA256SUMS.txt -Encoding ascii
          $assets += 'dist/SHA256SUMS.txt'
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists; preserving published assets."
            exit 0
          } else {
            gh release create $tag @assets --target $env:GITHUB_SHA --title "MeetingBar Windows $tag - Outlook clásico y español" --notes-file Installer/RELEASE_NOTES.md --latest --repo $env:GITHUB_REPOSITORY
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
