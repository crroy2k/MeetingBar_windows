version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - '*'
    commit-message:
      prefix: ci

  - package-ecosystem: nuget
    directories:
      - /app_WIN/SettingsApp
      - /app_WIN/WidgetProvider
    schedule:
      interval: weekly
    groups:
      windows-dependencies:
        patterns:
          - '*'
    commit-message:
      prefix: deps
